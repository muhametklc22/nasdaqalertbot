name: Deneysel Nasdaq alarmi
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 8-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nasdaq-alerts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - uses: actions/cache/restore@v5
        with:
          path: state.json
          key: alerts-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: alerts-${{ github.ref_name }}-
      - name: Tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - uses: actions/cache/save@v5
        if: always() && hashFiles('state.json') != ''
        with:
          path: state.json
          key: alerts-${{ github.ref_name }}-${{ github.run_id }}
